<script>
(() => {
  const root = document.getElementById('studygroup-prototype');
  const esc = value => String(value).replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
  const icon = name => `<i data-lucide="${name}" aria-hidden="true"></i>`;
  const avatar = (name, online=false) => `<span class="ss-avatar ${name==='Anan'?'ss-self':''}">${esc(name.slice(0,2).toUpperCase())}${online?'<span class="ss-online-dot"></span>':''}</span>`;
  const badge = text => `<span class="ss-badge">${esc(text)}</span>`;
  const initialRooms = () => [

      if(target.dataset.join){const room=state.rooms.find(r=>r.id===target.dataset.join);if(room&&!room.members.includes('Anan'))room.members.push('Anan');openRoom(room.id);tell('คุณเข้าร่วม '+room.name+' แล้ว');return;}
      if(target.dataset.tab){state.tab=target.dataset.tab;render();safeSave();return;}
      if(target.dataset.resultId){const id=target.dataset.resultId;closeModal();state.tab='chat';render();const found=Array.from(app.querySelectorAll('[data-message-id]')).find(el=>el.dataset.messageId===id);found?.classList.add('ss-highlight');tell('แสดงข้อความที่ค้นพบในห้องแชต');return;}
      if(target.dataset.fileId){const file=(state.messages[state.room]||[]).find(m=>m.id===target.dataset.fileId)?.file;if(file)modal('รายละเอียดไฟล์',`<div class="ss-member"><span class="ss-file-glyph">${icon('file-text')}</span><div class="ss-label"><p class="ss-name">${esc(file.name)}</p><p class="ss-small">${esc(file.size)} · ห้อง ${esc(current().name)}</p></div></div><p class="ss-small" style="margin-top:16px">ต้นแบบแสดงขั้นตอนรับไฟล์เท่านั้น ยังไม่มีการอัปโหลดหรือดาวน์โหลดไฟล์จริง</p><div class="ss-modal-actions"><button type="button" class="ss-btn ss-primary" data-action="close-modal">เข้าใจแล้ว</button></div>`);return;}
      switch(target.dataset.action){
        case 'send':send();break;
        case 'create':createModal();break;
        case 'close-modal':closeModal();break;
        case 'menu':state.mobile=!state.mobile;render();break;
        case 'directory':state.directory=true;state.mobile=false;render();safeSave();break;
        case 'ai':state.ai=!state.ai;render();safeSave();break;
        case 'close-ai':state.ai=false;render();safeSave();break;
        case 'search':searchModal();break;
        case 'attach':q('.ss-file-input').click();break;
        case 'members':modal(current().group?'สมาชิกในกลุ่ม':'ผู้ร่วมแชตส่วนตัว',`${current().members.map(name=>`<div class="ss-member">${avatar(name,true)}<span class="ss-label">${esc(name)} ${name==='Anan'?'<span class="ss-small">(คุณ)</span>':''}</span><span class="ss-small">ออนไลน์</span></div>`).join('')}<p class="ss-small" style="margin-top:15px">${current().group?'สมาชิกเลือกเข้าร่วมกลุ่มด้วยตัวเอง':'ข้อความนี้มองเห็นได้เฉพาะผู้ร่วมแชตสองคน'}</p>`);break;
        case 'connection':modal('การเชื่อมต่อเซิร์ฟเวอร์',`<p class="ss-small">ตัวอย่างหน้าตั้งค่า Desktop Client</p><label class="ss-field">Server address<input class="ss-input" value="chat.studygroup.example" aria-label="Server address"></label><label class="ss-field">Port<input class="ss-input" value="5000" inputmode="numeric" aria-label="Port"></label><p class="ss-small" style="margin-top:16px">สถานะในต้นแบบเป็นการจำลอง ยังไม่มีการเชื่อมต่อเครือข่ายจริง</p><div class="ss-modal-actions"><button type="button" class="ss-btn ss-primary" data-action="simulate-connect">ทดสอบการเชื่อมต่อ</button></div>`);break;
        case 'simulate-connect':closeModal();tell('เชื่อมต่อสำเร็จ — สถานะจำลอง');break;
        case 'account':modal('บัญชีของคุณ',`<div class="ss-member">${avatar('Anan')}<div><p class="ss-name">Anan</p><p class="ss-small">ชื่อผู้ใช้ไม่ซ้ำ · ออนไลน์</p></div></div><p class="ss-small" style="margin-top:18px">แชตส่วนตัวของคุณมองเห็นได้เฉพาะคู่สนทนา ส่วนแชตกลุ่มแสดงเฉพาะสมาชิกห้อง</p><div class="ss-modal-actions"><button type="button" class="ss-btn" data-action="restore-demo">คืนค่าบทสนทนาตัวอย่าง</button><button type="button" class="ss-btn ss-primary" data-action="close-modal">เสร็จสิ้น</button></div>`);break;
        case 'restore-demo':state.rooms=initialRooms();state.messages=initialMessages();state.room='network';state.directory=false;state.tab='chat';state.drafts={};closeModal();render();safeSave();tell('คืนค่าตัวอย่างแล้ว');break;
        case 'summarize':target.disabled=true;target.textContent='กำลังเตรียมสรุปตัวอย่าง…';setTimeout(()=>{showSummary();target.disabled=false;target.innerHTML=icon('refresh-cw')+' สรุปอีกครั้ง';updateIcons();tell('อัปเดตผลสรุปตัวอย่างแล้ว');},500);break;
      }
    });
    q('textarea').addEventListener('input',()=>{state.drafts[state.room]=q('textarea').value;});
    q('textarea').addEventListener('keydown',event=>{if(event.key==='Enter'&&!event.shiftKey&&!event.isComposing){event.preventDefault();send();}});
    q('.ss-file-input').addEventListener('change',()=>{
      const file=q('.ss-file-input').files[0];if(!file)return;
      if(file.size>5*1024*1024){tell('ไฟล์ใหญ่เกิน 5 MB กรุณาเลือกไฟล์ที่เล็กกว่า');q('.ss-file-input').value='';return;}
      if(!joined())return;
      const list=state.messages[state.room]||(state.messages[state.room]=[]);
      list.push({id:'file-'+Date.now(),from:'Anan',time:'14:12',date:'2026-11-02',file:{name:file.name,size:file.size>1024*1024?(file.size/1024/1024).toFixed(1)+' MB':Math.max(1,Math.round(file.size/1024))+' KB'}});
      q('.ss-file-input').value='';state.tab='chat';render();safeSave();tell('เพิ่มไฟล์แนบในต้นแบบแล้ว · ยังไม่มีการอัปโหลดจริง');
    });
    app.addEventListener('keydown',event=>{
      const dialog=q('.ss-modal');if(!dialog)return;
      if(event.key==='Escape'){closeModal();return;}
      if(event.key==='Tab'){
        const fields=Array.from(dialog.querySelectorAll('button,input,textarea')).filter(el=>!el.disabled&&!el.hidden);
        const first=fields[0],last=fields[fields.length-1];
        if(event.shiftKey&&document.activeElement===first){event.preventDefault();last?.focus();}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first?.focus();}
      }
    });
    const snapshot = () => ({design,room:state.room,tab:state.tab,directory:state.directory,ai:state.ai,rooms:state.rooms.slice(0,12),messages:Object.fromEntries(Object.entries(state.messages).map(([id,list])=>[id,list.slice(-12)]))});
    const restore = data => {
      if(!data||data.design!==design)return;
      if(Array.isArray(data.rooms)&&data.rooms.every(r=>typeof r.id==='string'&&typeof r.name==='string'&&Array.isArray(r.members)))state.rooms=data.rooms;
      if(data.messages&&typeof data.messages==='object')state.messages=data.messages;
      if(typeof data.room==='string'&&state.rooms.some(r=>r.id===data.room))state.room=data.room;
      if(['chat','files'].includes(data.tab))state.tab=data.tab;
      state.ai=typeof data.ai==='boolean'?data.ai:state.ai;state.directory=!!data.directory;render();
    };
    render();
    if(globalThis.Tweak){
      const tweak=new Tweak({container:app,onChange:()=>{app.style.borderRadius=state.radius+'px';}});
      tweak.addSlider(state,'radius',{label:'ความโค้งหน้าต่าง',min:0,max:24,unit:'px'});
    }
    return {snapshot,restore};
  };
  root.querySelectorAll('.ss-app').forEach(app=>controllers.push(bind(app,app.dataset.design)));
  const restoreAll = saved => {const data=saved?.privateContent?.studygroup;if(Array.isArray(data))controllers.forEach(controller=>{const snapshot=controller.snapshot();controller.restore(data.find(s=>s.design===snapshot.design));});};
  restoreAll(window.openai?.widgetState);
  window.addEventListener('openai:set_globals',event=>{if(event.detail?.globals?.widgetState)restoreAll(event.detail.globals.widgetState);});
})();
</script>
